
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e8f1f5">
  <title>La mia Agenda</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f8f7;
      color: #53666a;
    }

    header {
      background: #e4eff3;
      padding: 35px 20px;
      text-align: center;
    }

    h1 {
      color: #617f8b;
      font-size: 32px;
      margin: 0;
    }

    header p {
      color: #81969a;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 20px;
    }

    nav button {
      border: none;
      border-radius: 20px;
      padding: 12px 18px;
      background: #e5eee9;
      color: #61776c;
      cursor: pointer;
    }

    main {
      max-width: 850px;
      margin: 20px auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 3px 15px #dce5e2;
    }

    h2 {
      color: #78959d;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #9aa9a5;
    }
  </style>
</head>

<body>
  <header>
    <h1>La mia Agenda</h1>
    <p>Organizza i tuoi giorni, un passo alla volta ♡</p>
  </header>

  <nav>
    <button>Copertina</button>
    <button>Annuale</button>
    <button>Settimanale</button>
    <button>Giornaliera</button>
    <button>Finanziaria</button>
    <button>Zona studio</button>
  </nav>

  <main>
    <section class="welcome">
      <h2>Benvenuta nella tua agenda! ♡</h2>
      <p>Questo è l'inizio del tuo spazio personale.</p>
      <p>Qui potrai organizzare impegni, studio, obiettivi e risparmi.</p>
    </section>
  </main>

  <footer>
    La mia Agenda · Il tuo spazio, le tue regole
  </footer>
</body>
</html>
